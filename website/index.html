<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Workhorse AI — 下载</title>
    <meta
      name="description"
      content="下载 Workhorse AI 桌面客户端。支持 Windows 与 macOS。"
    />
    <link rel="icon" href="./assets/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #e8eef5;
        --ink-muted: rgba(232, 238, 245, 0.72);
        --ink-faint: rgba(232, 238, 245, 0.45);
        --accent: #3db8a8;
        --accent-strong: #2a9f90;
        --panel: rgba(8, 16, 28, 0.42);
        --line: rgba(232, 238, 245, 0.14);
        --win: #5b9fd4;
        --mac: #c9a66b;
        --radius: 14px;
        --font: "Outfit", "Segoe UI", sans-serif;
        --display: "Source Serif 4", Georgia, serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        font-family: var(--font);
        color: var(--ink);
        background:
          radial-gradient(ellipse 90% 70% at 70% 20%, rgba(61, 184, 168, 0.18), transparent 55%),
          radial-gradient(ellipse 70% 60% at 15% 85%, rgba(91, 159, 212, 0.16), transparent 50%),
          linear-gradient(165deg, #061018 0%, #0b1a2a 42%, #102033 100%);
        overflow-x: hidden;
      }

      .sky {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
          radial-gradient(1px 1px at 12% 18%, rgba(255, 255, 255, 0.55), transparent),
          radial-gradient(1px 1px at 28% 42%, rgba(255, 255, 255, 0.35), transparent),
          radial-gradient(1.5px 1.5px at 64% 14%, rgba(255, 255, 255, 0.5), transparent),
          radial-gradient(1px 1px at 81% 36%, rgba(255, 255, 255, 0.4), transparent),
          radial-gradient(1px 1px at 46% 72%, rgba(255, 255, 255, 0.3), transparent),
          radial-gradient(1.5px 1.5px at 88% 78%, rgba(255, 255, 255, 0.45), transparent);
        opacity: 0.7;
        animation: drift 28s linear infinite;
      }

      @keyframes drift {
        from {
          transform: translate3d(0, 0, 0);
        }
        to {
          transform: translate3d(-18px, 12px, 0);
        }
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(18px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes glow {
        0%,
        100% {
          filter: drop-shadow(0 0 18px rgba(61, 184, 168, 0.25));
        }
        50% {
          filter: drop-shadow(0 0 34px rgba(61, 184, 168, 0.45));
        }
      }

      .shell {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: clamp(24px, 5vw, 56px);
      }

      .hero {
        width: min(920px, 100%);
        text-align: center;
        animation: rise 0.8s ease-out both;
      }

      .mark {
        width: clamp(112px, 18vw, 168px);
        height: auto;
        margin: 0 auto 1.25rem;
        display: block;
        animation: glow 5s ease-in-out infinite, rise 0.9s ease-out both;
      }

      .brand {
        font-family: var(--display);
        font-size: clamp(2.4rem, 6vw, 3.6rem);
        font-weight: 600;
        letter-spacing: -0.02em;
        margin: 0 0 0.65rem;
        line-height: 1.05;
      }

      .tagline {
        margin: 0 auto 2rem;
        max-width: 34rem;
        color: var(--ink-muted);
        font-size: clamp(1rem, 2.2vw, 1.15rem);
        line-height: 1.55;
        font-weight: 400;
        animation: rise 1s ease-out 0.08s both;
      }

      .cta-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.85rem;
        justify-content: center;
        animation: rise 1.05s ease-out 0.14s both;
      }

      .btn {
        appearance: none;
        border: 1px solid transparent;
        border-radius: 999px;
        padding: 0.95rem 1.55rem;
        font: inherit;
        font-weight: 600;
        font-size: 1rem;
        text-decoration: none;
        color: #041018;
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
        cursor: pointer;
      }

      .btn:hover {
        transform: translateY(-2px);
      }

      .btn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      .btn-win {
        background: linear-gradient(180deg, #7ab8e0, var(--win));
        box-shadow: 0 10px 28px rgba(91, 159, 212, 0.28);
      }

      .btn-win:hover {
        background: linear-gradient(180deg, #8ec4e8, #4f93c9);
      }

      .btn-mac {
        background: linear-gradient(180deg, #dbc089, var(--mac));
        box-shadow: 0 10px 28px rgba(201, 166, 107, 0.28);
      }

      .btn-mac:hover {
        background: linear-gradient(180deg, #e4cd9c, #b8945a);
      }

      .btn[aria-disabled="true"] {
        opacity: 0.45;
        pointer-events: none;
        box-shadow: none;
      }

      .meta {
        margin-top: 1.35rem;
        color: var(--ink-faint);
        font-size: 0.9rem;
        animation: rise 1.1s ease-out 0.2s both;
      }

      .meta a {
        color: var(--ink-muted);
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      .secondary {
        margin-top: 2.75rem;
        padding-top: 1.5rem;
        border-top: 1px solid var(--line);
        color: var(--ink-faint);
        font-size: 0.92rem;
        animation: rise 1.15s ease-out 0.26s both;
      }

      .secondary summary {
        cursor: pointer;
        color: var(--ink-muted);
        list-style: none;
      }

      .secondary summary::-webkit-details-marker {
        display: none;
      }

      .secondary ul {
        list-style: none;
        margin: 0.85rem 0 0;
        padding: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem 1.25rem;
        justify-content: center;
      }

      .secondary a {
        color: var(--ink-muted);
      }

      .footer {
        margin-top: 2.5rem;
        font-size: 0.8rem;
        color: var(--ink-faint);
      }

      @media (max-width: 560px) {
        .cta-row {
          flex-direction: column;
          align-items: stretch;
        }

        .btn {
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <div class="sky" aria-hidden="true"></div>
    <main class="shell">
      <section class="hero">
        <img
          class="mark"
          src="./assets/workhorse-mark.png"
          width="168"
          height="168"
          alt="Workhorse AI"
        />
        <h1 class="brand">Workhorse AI</h1>
        <p class="tagline">桌面端智能工作站。选择你的系统，一键下载安装包。</p>

        <div class="cta-row" id="cta-row">
          <a
            class="btn btn-win"
            id="btn-win"
            href="./downloads/WorkhorseAI-Windows-Setup.exe"
            download
          >
            下载 Windows
          </a>
          <a
            class="btn btn-mac"
            id="btn-mac-arm64"
            href="./downloads/WorkhorseAI-macOS-arm64.dmg"
            download
          >
            下载 macOS（Apple 芯片）
          </a>
        </div>

        <p class="meta" id="version-meta">正在读取版本信息…</p>

        <details class="secondary">
          <summary>其他版本 / Intel Mac</summary>
          <ul>
            <li>
              <a id="btn-mac-x64" href="./downloads/WorkhorseAI-macOS-x64.dmg" download>
                macOS Intel（x64）
              </a>
            </li>
            <li>
              <a id="btn-win-alt" href="./downloads/WorkhorseAI-Windows-Setup.exe" download>
                Windows 安装包（备用链接）
              </a>
            </li>
          </ul>
        </details>

        <p class="footer">© Workhorse AI · bx-aigc.com</p>
      </section>
    </main>

    <script>
      (function () {
        var defaults = {
          version: "",
          updatedAt: "",
          windows: {
            label: "Windows",
            url: "./downloads/WorkhorseAI-Windows-Setup.exe",
            available: false,
          },
          macArm64: {
            label: "macOS Apple Silicon",
            url: "./downloads/WorkhorseAI-macOS-arm64.dmg",
            available: false,
          },
          macX64: {
            label: "macOS Intel",
            url: "./downloads/WorkhorseAI-macOS-x64.dmg",
            available: false,
          },
        };

        function wire(id, entry) {
          var el = document.getElementById(id);
          if (!el || !entry) return;
          el.href = entry.url || el.getAttribute("href");
          if (entry.available === false) {
            el.setAttribute("aria-disabled", "true");
            el.removeAttribute("download");
          } else {
            el.removeAttribute("aria-disabled");
            el.setAttribute("download", "");
          }
        }

        function apply(data) {
          wire("btn-win", data.windows);
          wire("btn-win-alt", data.windows);
          wire("btn-mac-arm64", data.macArm64);
          wire("btn-mac-x64", data.macX64);

          var bits = [];
          if (data.version) bits.push("当前版本 " + data.version);
          if (data.updatedAt) bits.push("更新于 " + data.updatedAt);
          var missing = [];
          if (!data.windows || !data.windows.available) missing.push("Windows");
          if (!data.macArm64 || !data.macArm64.available) missing.push("macOS Apple 芯片");
          if (!data.macX64 || !data.macX64.available) missing.push("macOS Intel");
          var meta = document.getElementById("version-meta");
          if (!meta) return;
          if (missing.length === 3) {
            meta.textContent = "安装包尚未上传。请稍后再试，或联系管理员发布。";
          } else if (missing.length) {
            meta.textContent =
              (bits.length ? bits.join(" · ") + "。 " : "") +
              "暂缺：" +
              missing.join("、") +
              "。";
          } else {
            meta.textContent = bits.join(" · ") || "Windows 与 macOS 均可下载。";
          }
        }

        fetch("./releases.json", { cache: "no-store" })
          .then(function (r) {
            return r.ok ? r.json() : defaults;
          })
          .then(function (data) {
            apply(Object.assign({}, defaults, data));
          })
          .catch(function () {
            apply(defaults);
          });
      })();
    </script>
  </body>
</html>
