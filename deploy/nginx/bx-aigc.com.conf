# Workhorse AI — bx-aigc.com (官网 / 下载页)
# 与 api.bx-aigc.com 反代配置并列；certbot 可同时签三个域名。

server {
    listen 80;
    server_name bx-aigc.com www.bx-aigc.com;

    root /var/www/bx-aigc.com;
    index index.html;

    # SPA / 历史链接兼容：/#/download-list 仍落到同一页
    location = /download-list {
        return 302 /;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /downloads/ {
        alias /var/www/bx-aigc.com/downloads/;
        autoindex off;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "public, max-age=300";
        types {
            application/octet-stream exe dmg;
        }
        default_type application/octet-stream;
    }

    location = /releases.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }
}
